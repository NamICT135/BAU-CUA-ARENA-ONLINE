<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=576, height=800">
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 576px; height: 800px; overflow: hidden; background: #160908; }
    #root { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .clip, canvas, .eye-light { position: absolute; inset: 0; width: 100%; height: 100%; }
    .eye-light { pointer-events: none; opacity: 0; mix-blend-mode: screen; }
    .eye-light svg { display: block; width: 100%; height: 100%; }
    .source { display: none; }
  </style>
</head>
<body>
  <div data-hf-id="hf-0e3s" id="root" data-composition-id="golden-dragon" data-start="0" data-duration="5" data-width="576" data-height="800">
      <canvas data-hf-id="hf-c5vw" id="dragon-surface" class="clip" data-start="0" data-duration="5" data-track-index="0" width="576" height="800" data-layout-allow-overflow="" aria-label="Rồng vàng giữa sóng nước"></canvas>
      <canvas data-hf-id="hf-apw8" id="dragon-atmosphere" class="clip" data-start="0" data-duration="5" data-track-index="1" width="576" height="800" data-layout-allow-overflow="" aria-hidden="true"></canvas>
      <svg data-hf-id="hf-2rp1" class="eye-light" id="eye-light" aria-hidden="true" viewBox="4 6 251 349" preserveAspectRatio="none">
          <defs data-hf-id="hf-mh0t"><filter data-hf-id="hf-mkee" id="eye-bloom" x="-200%" y="-300%" width="500%" height="700%"><fegaussianblur data-hf-id="hf-iyum" stdDeviation="1.7" /></filter></defs>
          <g data-hf-id="hf-f96s" id="eye-cores" fill="#ffdf46">
            <ellipse data-hf-id="hf-3s2a" cx="114" cy="155.5" rx="3.2" ry="1.4" transform="rotate(28 114 155.5)" filter="url(#eye-bloom)" />
            <ellipse data-hf-id="hf-gmod" cx="148" cy="155.5" rx="3.2" ry="1.4" transform="rotate(-28 148 155.5)" filter="url(#eye-bloom)" />
          </g>
      </svg>
    <img data-hf-id="hf-3yfp" class="source" id="reference" src="assets/reference.png" alt="">
    <img data-hf-id="hf-9fzj" class="source" id="water-plate" src="assets/clean-water-plate.png" alt="">
  </div>
  <script src="dragon-renderer.js"></script>
  <script>
    const driver = { time: 0 };
    const painter = new DragonRenderer(document.getElementById('dragon-surface'), document.getElementById('dragon-atmosphere'));
    const tl = gsap.timeline({ paused: true });
    tl.to(driver, { time: 5, duration: 5, ease: 'none', onUpdate: () => painter.draw(driver.time) }, 0);
    tl.fromTo('#eye-light', { opacity: 0 }, { opacity: 0.36, duration: 1.1, ease: 'sine.inOut' }, 0);
    tl.to('#eye-light', { opacity: 0.78, duration: 1.25, ease: 'power2.in' }, 1.1);
    tl.to('#eye-light', { opacity: 1, duration: 0.35, ease: 'power3.out' }, 2.35);
    tl.to('#eye-light', { opacity: 0.86, duration: 0.65, ease: 'sine.inOut' }, 2.7);
    tl.to('#eye-light', { opacity: 0, duration: 1.55, ease: 'sine.inOut' }, 3.35);
    tl.fromTo('#eye-cores', { y: 0 }, { y: 0.56, duration: 1, ease: 'sine.inOut' }, 0);
    tl.to('#eye-cores', { y: 2.8, duration: 1.5, ease: 'sine.inOut' }, 1);
    tl.to('#eye-cores', { y: 2.576, duration: 0.8, ease: 'sine.inOut' }, 2.5);
    tl.to('#eye-cores', { y: 0, duration: 1.7, ease: 'sine.inOut' }, 3.3);
    window.__timelines = window.__timelines || {};
    window.__timelines['golden-dragon'] = tl;
    window.dragonPainter = painter;
    window.__DRAGON_READY = painter.load(document.getElementById('reference'), document.getElementById('water-plate')).then(() => painter.draw(driver.time));
  </script>
</body>
</html>
