<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=524, height=724">
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #root { width: 524px; height: 724px; overflow: hidden; background: #210b20; }
    #root { position: relative; }
    canvas, .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
    .source { display: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="red-lion" data-start="0" data-duration="5" data-width="524" data-height="724">
    <canvas id="lion-surface" class="clip" data-start="0" data-duration="5" data-track-index="0" width="524" height="724" data-layout-allow-overflow aria-label="Lân đỏ được rig nhiều khớp và ba xúc xắc Bầu Cua"></canvas>
    <canvas id="lion-effects" class="clip" data-start="0" data-duration="5" data-track-index="1" width="524" height="724" data-layout-allow-overflow aria-hidden="true"></canvas>
    <img id="reference" class="source" src="assets/reference.png" alt="">
    <img id="plate" class="source" src="assets/rig-underplate.png" alt="">
    <img class="source die-symbol" src="assets/symbol-bau.png" alt="">
    <img class="source die-symbol" src="assets/symbol-cua.png" alt="">
    <img class="source die-symbol" src="assets/symbol-ca.png" alt="">
    <img class="source die-symbol" src="assets/symbol-tom.png" alt="">
    <img class="source die-symbol" src="assets/symbol-ga.png" alt="">
    <img class="source die-symbol" src="assets/symbol-nai.png" alt="">
  </div>
  <script src="lion-renderer.js"></script>
  <script>
    const drive = { time: 0 };
    const painter = new LionRenderer(document.getElementById('lion-surface'), document.getElementById('lion-effects'));
    const timeline = gsap.timeline({ paused: true });
    timeline.to(drive, { time: 5, duration: 5, ease: 'none', onUpdate: () => painter.draw(drive.time) }, 0);
    window.__timelines = { 'red-lion': timeline };
    window.lionPainter = painter;
    window.__LION_READY = painter.load(document.getElementById('reference'), document.getElementById('plate'), [...document.querySelectorAll('.die-symbol')]).then(() => painter.draw(drive.time));
  </script>
</body>
</html>
